# Next.js 16 na Netlify com o runtime oficial declarado explicitamente
# (sem ele, a Netlify publicou a pasta .next crua e tudo respondia 404).
# O antigo redirect /* → /index.html do site estático foi removido: ele quebraria as rotas do Next.js.
[build]
  command = "npm run build"
  publish = ".next"
  # Economiza créditos: não faz deploy quando o envio muda só automações (.github) ou documentação (.md).
  # Saída 0 do comando = a Netlify cancela o build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude).github' ':(exclude)*.md' ':(exclude)**/*.md'"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Arquivos de public/ saem direto da CDN da Netlify, sem passar pelos headers() do next.config:
# os cabeçalhos do service worker do app do painel precisam estar aqui também.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Security-Policy = "default-src 'self'; script-src 'self'"

[[headers]]
  for = "/manifest-painel.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
